<!DOCTYPE html>
<html>
<head>
  <title>SOStudent</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    #main { flex: 1; }
    footer { margin-top: auto; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <a class="navbar-brand" href="index.html">SOStudent</a>
  <div class="collapse navbar-collapse">
    <ul class="navbar-nav mr-auto">
      <li class="nav-item"><a class="nav-link" href="login.html">Home</a></li>
    </ul>
  </div>
  <a class="mx-4" href="login.html">Login</a>
</nav>

<div class="container" id="main">
  <div class="col-6 offset-3">
    <h2 class="text-center">Create an Account</h2>
    <div class="form-group">
      <label>First Name:</label>
      <input id="firstname" type="text" class="form-control" placeholder="First Name" required>
    </div>
    <div class="form-group">
      <label>Last Name:</label>
      <input id="lastname" type="text" class="form-control" placeholder="Last Name" required>
    </div>
    <div class="form-group">
      <label>Username:</label>
      <input id="username" type="text" class="form-control" placeholder="Username" required>
    </div>
    <div class="form-group">
      <label>Email:</label>
      <input id="email" type="email" class="form-control" placeholder="Email" required>
    </div>
    <div class="form-group">
      <label>Password:</label>
      <input id="password" type="password" class="form-control" placeholder="Password" required>
    </div>
    <div class="form-group">
      <label>Confirm Password:</label>
      <input id="passconf" type="password" class="form-control" placeholder="Confirm" required>
    </div>
    <div id="error" class="form-group"></div>
    <div class="form-group">
      <button onclick="doRegister()" class="btn btn-primary btn-block">Register</button>
      <label>Already have an account?</label>
      <a href="login.html">Log in</a>
    </div>
  </div>
</div>

<footer id="footer" class="bg-light mt-4">
  <div class="container"><p>&copy; 2023 SOStudent</p></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
  function doRegister() {
    const firstname = document.getElementById('firstname').value.trim();
    const lastname  = document.getElementById('lastname').value.trim();
    const username  = document.getElementById('username').value.trim();
    const email     = document.getElementById('email').value.trim();
    const password  = document.getElementById('password').value;
    const passconf  = document.getElementById('passconf').value;
    const err = document.getElementById('error');

    if (!firstname || !lastname || !username || !email || !password) {
      err.innerHTML = '<div class="alert alert-danger">All fields are required.</div>'; return;
    }
    if (!/^[a-zA-Z]+$/.test(firstname) || !/^[a-zA-Z]+$/.test(lastname)) {
      err.innerHTML = '<div class="alert alert-danger">First and last name must contain only letters.</div>'; return;
    }
    if (username.length < 4 || username.length > 15) {
      err.innerHTML = '<div class="alert alert-danger">Username must be 4–15 characters.</div>'; return;
    }
    if (password.length < 10) {
      err.innerHTML = '<div class="alert alert-danger">Password must be at least 10 characters.</div>'; return;
    }
    if (password !== passconf) {
      err.innerHTML = '<div class="alert alert-danger">Passwords do not match.</div>'; return;
    }
    const result = SOStudent.auth.register({ firstname, lastname, username, email, password });
    if (result.ok) {
      window.location.href = 'account-success.html';
    } else {
      err.innerHTML = `<div class="alert alert-danger">${result.error}</div>`;
    }
  }
</script>
</body>
</html>
