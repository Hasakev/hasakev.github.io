<!DOCTYPE html>
<html>
<head>
  <title>SOStudent</title>
  <link rel="stylesheet" type="text/css" href="assets/css/bootstrap.css">
  <style>
    #main { height: 100%; }
    footer { position: relative; left: 0; right: 0; margin-top: auto; }
    body { display: flex; flex-direction: column; min-height: 100vh; }
    #main { flex: 1; padding-top: 20px; }
    .recaptcha-box {
      border: 1px solid #d3d3d3; border-radius: 3px; background: #f9f9f9;
      padding: 12px 16px; display: flex; align-items: center;
      justify-content: space-between; max-width: 300px;
    }
    .recaptcha-logo { font-size: 10px; color: #555; text-align: center; line-height: 1.3; }
    .recaptcha-logo img { width: 32px; display: block; margin: 0 auto 2px; }
  </style>
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="container" id="main">
  <div class="col-6 offset-3">
    <h2 class="text-center">Create an Account</h2>
    <div class="form-group">
      <label for="firstname">First Name:</label>
      <input id="firstname" type="text" class="form-control" placeholder="First Name" required>
    </div>
    <div class="form-group">
      <label for="lastname">Last Name:</label>
      <input id="lastname" type="text" class="form-control" placeholder="Last Name" required>
    </div>
    <div class="form-group">
      <label for="username">Username:</label>
      <input id="username" type="text" class="form-control" placeholder="Username" required>
    </div>
    <div class="form-group">
      <label for="email">Email:</label>
      <input id="email" type="email" class="form-control" placeholder="Email" required>
    </div>
    <div class="form-group">
      <label for="password">Password:</label>
      <input id="password" type="password" class="form-control" placeholder="Password (min 10 chars)" required>
    </div>
    <div class="form-group">
      <label for="passconf">Confirm Password:</label>
      <input id="passconf" type="password" class="form-control" placeholder="Confirm" required>
    </div>

    <!-- reCAPTCHA v2 demo widget -->
    <div class="form-group">
      <div class="recaptcha-box">
        <label class="form-check-label mb-0" style="cursor:pointer;">
          <input type="checkbox" id="recaptcha" class="mr-2"> I'm not a robot
        </label>
        <div class="recaptcha-logo">
          <svg width="32" height="32" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="32" cy="32" r="32" fill="#4A90D9"/>
            <path d="M20 32 L28 40 L44 24" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          reCAPTCHA<br><span style="font-size:9px;color:#aaa;">Demo only</span>
        </div>
      </div>
    </div>

    <div id="error" class="form-group"></div>
    <div class="form-group">
      <button onclick="doRegister()" class="btn btn-primary btn-block">Register</button>
      <label>Already have an account?</label>
      <a href="login.html">Log in</a>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="assets/js/jquery-3.6.0.min.js"></script>
<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
  SOStudent.renderNav();
  SOStudent.renderFooter();

  function doRegister() {
    const firstname = $('#firstname').val().trim();
    const lastname  = $('#lastname').val().trim();
    const username  = $('#username').val().trim();
    const email     = $('#email').val().trim();
    const password  = $('#password').val();
    const passconf  = $('#passconf').val();
    const err = $('#error');

    if (!$('#recaptcha').is(':checked')) {
      err.html('<div class="alert alert-danger">Please confirm you are not a robot.</div>'); return;
    }
    if (!firstname || !lastname || !username || !email || !password) {
      err.html('<div class="alert alert-danger">All fields are required.</div>'); return;
    }
    if (!/^[a-zA-Z]+$/.test(firstname) || !/^[a-zA-Z]+$/.test(lastname)) {
      err.html('<div class="alert alert-danger">First and last name must contain only letters.</div>'); return;
    }
    if (username.length < 4 || username.length > 15) {
      err.html('<div class="alert alert-danger">Username must be 4–15 characters.</div>'); return;
    }
    if (password.length < 10) {
      err.html('<div class="alert alert-danger">Password must be at least 10 characters.</div>'); return;
    }
    if (password !== passconf) {
      err.html('<div class="alert alert-danger">Passwords do not match.</div>'); return;
    }

    const result = SOStudent.auth.register({ firstname, lastname, username, email, password });
    if (!result.ok) { err.html(`<div class="alert alert-danger">${result.error}</div>`); return; }

    const code = SOStudent.verification.generate(username);
    window.location.href = `verify-email.html?u=${encodeURIComponent(username)}&demo_code=${code}`;
  }
</script>
</body>
</html>
