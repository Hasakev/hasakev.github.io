<!DOCTYPE html>
<html>
<head>
  <title>SOStudent</title>
  <link rel="stylesheet" type="text/css" href="assets/css/bootstrap.css">
  <style>
    #main { height: 100%; }
    footer { position: relative; left: 0; right: 0; margin-top: auto; }
    body { display: flex; flex-direction: column; min-height: 100vh; }
    #main { flex: 1; }
    .attachment-thumb { max-width: 200px; max-height: 150px; object-fit: cover; margin: 4px; border: 1px solid #ddd; border-radius: 4px; }
    .attachment-file { display: inline-block; padding: 4px 10px; background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 4px; margin: 4px; font-size: 0.85rem; }
    .processed-label { font-size: 0.7rem; color: #888; display: block; text-align: center; }
  </style>
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="container" id="main">
  <div id="question-content" class="mt-3"></div>
</div>

<div id="footer-placeholder"></div>

<script src="assets/js/jquery-3.6.0.min.js"></script>
<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
  if (!SOStudent.initPage(true)) throw '';

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if (!id) window.location.href = 'home.html';

  const cu = SOStudent.auth.currentUser();

  // track view for recommendation system
  SOStudent.views.track(id);

  function escHtml(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function render() {
    const q = SOStudent.questions.get(id);
    if (!q) { window.location.href = 'home.html'; return; }

    const comments    = SOStudent.comments.forQuestion(id);
    const isFav       = SOStudent.favourites.has(id);
    const isBookmark  = SOStudent.bookmarks.has(id);
    const isOwner     = cu && cu.username === q.username;
    const files       = SOStudent.attachments.get(id);

    // build attachments HTML
    let attachHtml = '';
    if (files.length > 0) {
      attachHtml = `<div class="mt-2 mb-2"><strong>Attachments:</strong><br>`;
      files.forEach(f => {
        if (f.type && f.type.startsWith('image/')) {
          attachHtml += `<span style="display:inline-block;text-align:center;">
            <img src="${f.dataUrl}" class="attachment-thumb" alt="${escHtml(f.name)}">
            <span class="processed-label">Processed (50% crop, 60° rot)</span>
          </span>`;
        } else {
          attachHtml += `<span class="attachment-file">📎 ${escHtml(f.name)}</span>`;
        }
      });
      attachHtml += `</div>`;
    }

    $('#question-content').html(`
      <h2>${escHtml(q.question)}</h2>
      <p>
        Posted by: <strong>${escHtml(q.username)}</strong><br>
        Time: ${escHtml(q.time)}<br>
        Subject: ${escHtml(q.subject)}
      </p>
      ${attachHtml}
      Favourites: <span id="currentRating">${q.rating}</span>
      <br>
      <button id="fav" class="btn btn-sm ${isFav ? 'btn-warning' : 'btn-outline-warning'} mt-1" onclick="toggleFav()">
        ${isFav ? 'Unfavourite' : 'Favourite'}
      </button>
      <button id="bookmark-btn" class="btn btn-sm ${isBookmark ? 'btn-secondary' : 'btn-outline-secondary'} mt-1 ml-1" onclick="toggleBookmark()">
        ${isBookmark ? '🔖 Bookmarked' : '🔖 Bookmark'}
      </button>
      ${isOwner ? `<button class="btn btn-sm btn-danger mt-1 ml-1" onclick="deleteQ()">Delete Question</button>` : ''}

      <hr>
      <p>${escHtml(q.content).replace(/\n/g,'<br>')}</p>
      <hr>
      <h4>Comments</h4>
      <a href="add-comment.html?id=${id}" class="btn btn-sm btn-outline-secondary mb-3">Add Comment</a>
      <div id="comments-list">
        ${comments.length === 0
          ? '<p class="text-muted">No comments yet.</p>'
          : comments.map(c => `
              <p><strong>${escHtml(c.username)}</strong> commented:<br>
              ${escHtml(c.comment)}</p>`).join('')}
      </div>
    `);
  }

  function toggleFav() {
    SOStudent.favourites.toggle(id);
    render();
  }

  function toggleBookmark() {
    SOStudent.bookmarks.toggle(id);
    render();
  }

  function deleteQ() {
    if (!confirm('Are you sure you want to delete this question? You will be redirected to the homepage.')) return;
    SOStudent.questions.delete(id);
    window.location.href = 'home.html';
  }

  render();
</script>
</body>
</html>
