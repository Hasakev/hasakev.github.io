<!DOCTYPE html>
<html>
<head>
  <title>SOStudent</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    #main { flex: 1; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <a class="navbar-brand" href="home.html">SOStudent</a>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navContent">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navContent">
    <ul class="navbar-nav mr-auto">
      <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
      <li class="nav-item" id="nav-profile" style="display:none;"><a class="nav-link" href="profile.html">Profile</a></li>
    </ul>
  </div>
  <a class="mx-4" href="login.html" id="nav-login">Login</a>
  <a class="mx-4" href="#" id="nav-logout" onclick="SOStudent.auth.logout(); return false;" style="display:none;">Logout</a>
</nav>

<div class="container" id="main">
  <div id="question-content"></div>
</div>

<footer id="footer" class="bg-light mt-4">
  <div class="container"><p>&copy; 2023 SOStudent</p></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
  if (!SOStudent.auth.requireLogin()) throw '';
  SOStudent.renderNav();

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if (!id) window.location.href = 'home.html';

  const cu = SOStudent.auth.currentUser();

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function render() {
    const q = SOStudent.questions.get(id);
    if (!q) { window.location.href = 'home.html'; return; }
    const comments = SOStudent.comments.forQuestion(id);
    const isFav = SOStudent.favourites.has(id);
    const isOwner = cu && cu.username === q.username;

    document.getElementById('question-content').innerHTML = `
      <h2 class="mt-3">${escHtml(q.question)}</h2>
      <p>
        Posted by: <strong>${escHtml(q.username)}</strong><br>
        Time: ${escHtml(q.time)}<br>
        Subject: <span class="badge badge-secondary">${escHtml(q.subject)}</span>
      </p>
      <p>Favourites: <span id="rating">${q.rating}</span></p>
      <button id="fav-btn" class="btn btn-sm ${isFav ? 'btn-warning' : 'btn-outline-warning'}" onclick="toggleFav()">
        ${isFav ? 'Unfavourite' : 'Favourite'}
      </button>
      ${isOwner ? `<button class="btn btn-sm btn-danger ml-2" onclick="deleteQ()">Delete Question</button>` : ''}
      <hr>
      <p>${escHtml(q.content).replace(/\n/g,'<br>')}</p>
      <hr>
      <h4>Comments</h4>
      <a href="add-comment.html?id=${id}" class="btn btn-sm btn-outline-secondary mb-3">Add Comment</a>
      <div id="comments-list">
        ${comments.length === 0 ? '<p class="text-muted">No comments yet.</p>' : comments.map(c => `
          <div class="mb-2">
            <strong>${escHtml(c.username)}</strong> commented:
            <p class="mb-1">${escHtml(c.comment)}</p>
            <small class="text-muted">${escHtml(c.time)}</small>
            <hr>
          </div>
        `).join('')}
      </div>
    `;
  }

  function toggleFav() {
    const newRating = SOStudent.favourites.toggle(id);
    render();
  }

  function deleteQ() {
    if (!confirm('Are you sure you want to delete this question? You will be redirected to homepage.')) return;
    SOStudent.questions.delete(id);
    window.location.href = 'home.html';
  }

  render();
</script>
</body>
</html>
