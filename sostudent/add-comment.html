<!DOCTYPE html>
<html>
<head>
  <title>SOStudent</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    #main { flex: 1; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <a class="navbar-brand" href="home.html">SOStudent</a>
  <div class="collapse navbar-collapse">
    <ul class="navbar-nav mr-auto">
      <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
      <li class="nav-item" id="nav-profile" style="display:none;"><a class="nav-link" href="profile.html">Profile</a></li>
    </ul>
  </div>
  <a class="mx-4" href="login.html" id="nav-login">Login</a>
  <a class="mx-4" href="#" id="nav-logout" onclick="SOStudent.auth.logout(); return false;" style="display:none;">Logout</a>
</nav>

<div class="container" id="main">
  <div class="col-6 offset-3">
    <h2 class="text-center">Add Comment</h2>
    <p id="question-title" class="text-muted"></p>
    <div class="form-group">
      <label>Comment:</label>
      <textarea id="comment" class="form-control" placeholder="Your comment" rows="4" maxlength="10000" required></textarea>
    </div>
    <div id="error" class="form-group"></div>
    <div class="form-group">
      <button onclick="doComment()" class="btn btn-primary btn-block">Submit Comment</button>
      <a id="back-link" href="home.html" class="btn btn-link">Go back</a>
    </div>
  </div>
</div>

<footer class="bg-light mt-4">
  <div class="container"><p>&copy; 2023 SOStudent</p></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
  if (!SOStudent.auth.requireLogin()) throw '';
  SOStudent.renderNav();

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if (!id) window.location.href = 'home.html';

  document.getElementById('back-link').href = `question.html?id=${id}`;

  const q = SOStudent.questions.get(id);
  if (q) document.getElementById('question-title').textContent = `On: "${q.question}"`;

  function doComment() {
    const comment = document.getElementById('comment').value.trim();
    const err = document.getElementById('error');
    if (!comment) { err.innerHTML = '<div class="alert alert-danger">Comment cannot be empty.</div>'; return; }
    SOStudent.comments.add(id, comment);
    window.location.href = `question.html?id=${id}`;
  }
</script>
</body>
</html>
