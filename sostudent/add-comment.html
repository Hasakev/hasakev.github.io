<!DOCTYPE html>
<html>
<head>
  <title>SOStudent</title>
  <link rel="stylesheet" type="text/css" href="assets/css/bootstrap.css">
  <style>
    #main { height: 100%; }
    footer { position: relative; left: 0; right: 0; margin-top: auto; }
    body { display: flex; flex-direction: column; min-height: 100vh; }
    #main { flex: 1; }
  </style>
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="container" id="main">
  <div class="col-6 offset-3">
    <h2 class="text-center mt-3">Add Comment</h2>
    <p id="question-title" class="text-muted"></p>
    <div class="form-group">
      <label>Comment:</label>
      <textarea id="comment" class="form-control" rows="4" placeholder="Your comment" maxlength="10000" required></textarea>
    </div>
    <div id="error" class="form-group"></div>
    <div class="form-group">
      <button onclick="doComment()" class="btn btn-primary btn-block">Submit Comment</button>
      <a id="back-link" href="home.html" class="btn btn-link">Go back</a>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="assets/js/jquery-3.6.0.min.js"></script>
<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
  if (!SOStudent.initPage(true)) throw '';

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if (!id) window.location.href = 'home.html';

  $('#back-link').attr('href', `question.html?id=${id}`);
  const q = SOStudent.questions.get(id);
  if (q) $('#question-title').text(`On: "${q.question}"`);

  function doComment() {
    const comment = $('#comment').val().trim();
    if (!comment) { $('#error').html('<div class="alert alert-danger">Comment cannot be empty.</div>'); return; }
    SOStudent.comments.add(id, comment);
    window.location.href = `question.html?id=${id}`;
  }
</script>
</body>
</html>
