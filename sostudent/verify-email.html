<!DOCTYPE html>
<html>
<head>
  <title>SOStudent — Verify Email</title>
  <link rel="stylesheet" type="text/css" href="assets/css/bootstrap.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    #main { flex: 1; padding-top: 30px; }
    footer { position: relative; }
    .code-badge { font-size: 2rem; letter-spacing: 0.4rem; font-weight: bold; font-family: monospace; background: #f4f4f4; padding: 10px 20px; border-radius: 6px; display: inline-block; }
  </style>
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="container" id="main">
  <div class="col-6 offset-3 text-center">
    <h2>Verify Your Email</h2>
    <p class="text-muted mt-2">
      In the real app, a verification email would be sent to your inbox.<br>
      Since this is a demo, your code is shown here:
    </p>
    <div id="demo-code-box" class="mt-3 mb-4"></div>
    <p class="text-muted small">Enter the 6-digit code below to activate your account.</p>

    <div class="form-group">
      <input id="code" type="text" class="form-control text-center" maxlength="6" placeholder="000000" style="font-size:1.4rem; letter-spacing:0.3rem;">
    </div>
    <div id="error" class="form-group"></div>
    <button onclick="doVerify()" class="btn btn-primary btn-block">Verify Email</button>
    <a href="login.html" class="btn btn-link mt-2">Back to Login</a>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="assets/js/jquery-3.6.0.min.js"></script>
<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
  SOStudent.renderNav();
  SOStudent.renderFooter();

  const params = new URLSearchParams(window.location.search);
  const username = params.get('u');
  const demoCode = params.get('demo_code');

  if (!username) window.location.href = 'login.html';

  if (demoCode) {
    $('#demo-code-box').html(`<div class="code-badge">${demoCode}</div>`);
  } else {
    const existing = SOStudent.verification.pendingCode(username);
    if (existing) {
      $('#demo-code-box').html(`<div class="code-badge">${existing}</div>`);
    } else if (SOStudent.verification.isVerified(username)) {
      window.location.href = 'login.html';
    } else {
      $('#demo-code-box').html('<p class="text-danger">No pending verification found.</p>');
    }
  }

  function doVerify() {
    const code = $('#code').val().trim();
    if (code.length !== 6) {
      $('#error').html('<div class="alert alert-danger">Please enter the 6-digit code.</div>'); return;
    }
    if (SOStudent.verification.verify(username, code)) {
      window.location.href = 'account-success.html';
    } else {
      $('#error').html('<div class="alert alert-danger">Incorrect code. Please try again.</div>');
    }
  }
</script>
</body>
</html>
