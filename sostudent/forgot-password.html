<!DOCTYPE html>
<html>
<head>
  <title>SOStudent — Forgot Password</title>
  <link rel="stylesheet" type="text/css" href="assets/css/bootstrap.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    #main { flex: 1; padding-top: 30px; }
    footer { position: relative; }
    .code-badge { font-size: 2rem; letter-spacing: 0.4rem; font-weight: bold; font-family: monospace; background: #f4f4f4; padding: 10px 20px; border-radius: 6px; display: inline-block; }
  </style>
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="container" id="main">
  <div class="col-4 offset-4">
    <h2 class="text-center">Reset Password</h2>
    <p class="text-muted text-center">Enter your email and we'll send you a reset code.</p>

    <div id="step1">
      <div class="form-group">
        <input type="email" id="email" class="form-control" placeholder="Email address" required>
      </div>
      <div id="error1" class="form-group"></div>
      <button onclick="sendCode()" class="btn btn-primary btn-block">Send Reset Code</button>
      <a href="login.html" class="btn btn-link btn-block">Back to Login</a>
    </div>

    <div id="step2" style="display:none;" class="text-center">
      <p class="text-muted">In the real app, a reset email would be sent. Your demo code:</p>
      <div id="reset-code-box" class="mb-3"></div>
      <p class="text-muted small">Enter it below to set a new password.</p>
      <div class="form-group text-left">
        <input id="code" type="text" class="form-control text-center" maxlength="6" placeholder="000000" style="font-size:1.4rem; letter-spacing:0.3rem;">
      </div>
      <div class="form-group text-left">
        <input id="newpass" type="password" class="form-control" placeholder="New password (min 10 chars)">
      </div>
      <div class="form-group text-left">
        <input id="confpass" type="password" class="form-control" placeholder="Confirm new password">
      </div>
      <div id="error2" class="form-group text-left"></div>
      <button onclick="doReset()" class="btn btn-primary btn-block">Reset Password</button>
    </div>

    <div id="step3" style="display:none;" class="text-center">
      <div class="alert alert-success">Password reset successfully!</div>
      <a href="login.html" class="btn btn-primary">Log in with new password</a>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="assets/js/jquery-3.6.0.min.js"></script>
<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
  SOStudent.renderNav();
  SOStudent.renderFooter();

  let currentCode = null;

  function sendCode() {
    const email = $('#email').val().trim();
    if (!email) { $('#error1').html('<div class="alert alert-danger">Please enter your email.</div>'); return; }
    const result = SOStudent.resetCodes.generate(email);
    if (!result) {
      $('#error1').html('<div class="alert alert-danger">No account found with that email address.</div>'); return;
    }
    currentCode = result.code;
    $('#reset-code-box').html(`<div class="code-badge">${result.code}</div>`);
    $('#step1').hide();
    $('#step2').show();
  }

  function doReset() {
    const code    = $('#code').val().trim();
    const newpass = $('#newpass').val();
    const confpass = $('#confpass').val();
    const err = $('#error2');

    if (code.length !== 6) { err.html('<div class="alert alert-danger">Please enter the 6-digit code.</div>'); return; }
    if (newpass.length < 10) { err.html('<div class="alert alert-danger">Password must be at least 10 characters.</div>'); return; }
    if (newpass !== confpass) { err.html('<div class="alert alert-danger">Passwords do not match.</div>'); return; }

    const result = SOStudent.resetCodes.verify(code, newpass);
    if (result.ok) {
      $('#step2').hide();
      $('#step3').show();
    } else {
      err.html(`<div class="alert alert-danger">${result.error}</div>`);
    }
  }
</script>
</body>
</html>
