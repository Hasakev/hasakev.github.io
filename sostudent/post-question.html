<!DOCTYPE html>
<html>
<head>
  <title>SOStudent</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    #main { flex: 1; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <a class="navbar-brand" href="home.html">SOStudent</a>
  <div class="collapse navbar-collapse">
    <ul class="navbar-nav mr-auto">
      <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
      <li class="nav-item" id="nav-profile" style="display:none;"><a class="nav-link" href="profile.html">Profile</a></li>
    </ul>
  </div>
  <a class="mx-4" href="login.html" id="nav-login">Login</a>
  <a class="mx-4" href="#" id="nav-logout" onclick="SOStudent.auth.logout(); return false;" style="display:none;">Logout</a>
</nav>

<div class="container" id="main">
  <div class="col-6 offset-3">
    <h2 class="text-center">New Question</h2>
    <div class="form-group">
      <label>Subject:</label>
      <input id="subject" type="text" class="form-control" placeholder="Subject" required>
    </div>
    <div class="form-group">
      <label>Question:</label>
      <input id="question" type="text" class="form-control" placeholder="Question" required>
    </div>
    <div class="form-group">
      <label>Content:</label>
      <textarea id="content" class="form-control" placeholder="Content" rows="5" maxlength="10000" required></textarea>
    </div>
    <div id="error" class="form-group"></div>
    <div class="form-group">
      <button onclick="doPost()" class="btn btn-primary btn-block">Post</button>
      <a href="home.html" class="btn btn-link">Never mind, go back</a>
    </div>
  </div>
</div>

<footer class="bg-light mt-4">
  <div class="container"><p>&copy; 2023 SOStudent</p></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
  if (!SOStudent.auth.requireLogin()) throw '';
  SOStudent.renderNav();

  function doPost() {
    const subject  = document.getElementById('subject').value.trim();
    const question = document.getElementById('question').value.trim();
    const content  = document.getElementById('content').value.trim();
    const err = document.getElementById('error');
    if (!subject || !question || !content) {
      err.innerHTML = '<div class="alert alert-danger">All fields are required.</div>'; return;
    }
    const q = SOStudent.questions.add({ subject, question, content });
    window.location.href = `question.html?id=${q.id}`;
  }
</script>
</body>
</html>
