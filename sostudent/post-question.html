<!DOCTYPE html>
<html>
<head>
  <title>SOStudent</title>
  <link rel="stylesheet" type="text/css" href="assets/css/bootstrap.css">
  <link rel="stylesheet" href="https://unpkg.com/dropzone@5/dist/min/dropzone.min.css">
  <style>
    #main { height: 100%; }
    footer { position: relative; left: 0; right: 0; margin-top: auto; }
    body { display: flex; flex-direction: column; min-height: 100vh; }
    #main { flex: 1; }
    #my-dropzone {
      border: 2px dashed #007bff; border-radius: 6px; background: #f8f9fa;
      padding: 20px; text-align: center; cursor: pointer; color: #555;
    }
    #my-dropzone .dz-message { margin: 0; font-size: 0.9rem; }
    #my-dropzone.dz-drag-hover { border-color: #0056b3; background: #e8f0fe; }
    .dropzone .dz-preview .dz-image { border-radius: 4px; }
    .dropzone .dz-preview.dz-image-preview { background: transparent; }
  </style>
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="container" id="main">
  <div class="col-6 offset-3">
    <h2 class="text-center mt-3">New Question</h2>
    <div class="form-group">
      <label>Subject:</label>
      <input id="subject" type="text" class="form-control" placeholder="e.g. Algorithms, Web Dev, Databases" required>
    </div>
    <div class="form-group">
      <label>Question:</label>
      <input id="question" type="text" class="form-control" placeholder="Question title" required>
    </div>
    <div class="form-group">
      <label>Content:</label>
      <textarea id="content" class="form-control input-group-lg" rows="5" placeholder="Describe your question in detail" maxlength="10000" required></textarea>
    </div>

    <!-- Dropzone file upload -->
    <div class="form-group">
      <label>Attachments <span class="text-muted small">(optional — drag &amp; drop or click)</span></label>
      <div id="my-dropzone" class="dropzone">
        <div class="dz-message">
          Drop files here or click to upload<br>
          <span class="text-muted" style="font-size:0.8rem;">Images will be processed: 50% crop from centre, 60° rotation simulation</span>
        </div>
      </div>
    </div>

    <div id="error" class="form-group"></div>
    <div class="form-group">
      <button onclick="doPost()" class="btn btn-primary btn-block">Post</button>
      <a href="home.html" class="btn btn-link">Never mind, I don't have a new question. Go back</a>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="assets/js/jquery-3.6.0.min.js"></script>
<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/dropzone@5/dist/min/dropzone.min.js"></script>
<script src="js/app.js"></script>
<script>
  if (!SOStudent.initPage(true)) throw '';

  Dropzone.autoDiscover = false;
  const dz = new Dropzone('#my-dropzone', {
    url: '#',
    autoProcessQueue: false,
    addRemoveLinks: true,
    maxFilesize: 2,
    acceptedFiles: 'image/*,.pdf,.txt,.doc,.docx',
    dictDefaultMessage: 'Drop files here or click to upload',
    init() {
      this.on('addedfile', file => {
        if (file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = e => { file.dataUrl = e.target.result; };
          reader.readAsDataURL(file);
        }
      });
    }
  });

  function doPost() {
    const subject  = $('#subject').val().trim();
    const question = $('#question').val().trim();
    const content  = $('#content').val().trim();
    const err = $('#error');
    if (!subject || !question || !content) {
      err.html('<div class="alert alert-danger">All fields are required.</div>'); return;
    }
    const q = SOStudent.questions.add({ subject, question, content });
    // save attachments
    const files = dz.files.map(f => ({
      name: f.name,
      type: f.type,
      dataUrl: f.dataUrl || null,
    }));
    if (files.length > 0) SOStudent.attachments.save(q.id, files);
    window.location.href = `question.html?id=${q.id}`;
  }
</script>
</body>
</html>
