<!DOCTYPE html>
<html>
<head>
  <title>SOStudent</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    #main { flex: 1; }
    .profile-label { font-weight: 600; width: 140px; display: inline-block; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <a class="navbar-brand" href="home.html">SOStudent</a>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navContent">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navContent">
    <ul class="navbar-nav mr-auto">
      <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
      <li class="nav-item" id="nav-profile"><a class="nav-link" href="profile.html">Profile</a></li>
    </ul>
  </div>
  <a class="mx-4" href="login.html" id="nav-login" style="display:none;">Login</a>
  <a class="mx-4" href="#" id="nav-logout" onclick="SOStudent.auth.logout(); return false;">Logout</a>
</nav>

<div class="container" id="main">
  <h2 class="mt-3">Profile</h2>
  <div class="card mt-3 col-6">
    <div class="card-body">
      <p>
        <span class="profile-label">Username:</span>
        <span id="p-username"></span>
        <a href="change-username.html" class="ml-2 small">Change</a>
      </p>
      <p>
        <span class="profile-label">Name:</span>
        <span id="p-name"></span>
        <a href="change-name.html" class="ml-2 small">Change</a>
      </p>
      <p>
        <span class="profile-label">Email:</span>
        <span id="p-email"></span>
      </p>
      <p>
        <span class="profile-label">Email Verified:</span>
        <span class="badge badge-success">Verified</span>
        <span class="text-muted small ml-1">(demo — always verified)</span>
      </p>
      <hr>
      <a href="change-password.html" class="btn btn-outline-secondary btn-sm">Change Password</a>
    </div>
  </div>
</div>

<footer class="bg-light mt-4">
  <div class="container"><p>&copy; 2023 SOStudent</p></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
  if (!SOStudent.auth.requireLogin()) throw '';

  const cu = SOStudent.auth.currentUser();
  document.getElementById('p-username').textContent = cu.username;
  document.getElementById('p-name').textContent = `${cu.firstname} ${cu.lastname}`;
  document.getElementById('p-email').textContent = cu.email;
</script>
</body>
</html>
