<!DOCTYPE html>
<html>
<head>
  <title>SOStudent</title>
  <link rel="stylesheet" type="text/css" href="assets/css/bootstrap.css">
  <style>
    #main { height: 100%; }
    footer { position: relative; left: 0; right: 0; margin-top: auto; }
    body { display: flex; flex-direction: column; min-height: 100vh; }
    #main { flex: 1; }
    .profile-key { font-weight: 600; width: 130px; display: inline-block; }
  </style>
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="container" id="main">
  <h2 class="mt-3">Profile</h2>
  <div class="card mt-3" style="max-width:500px;">
    <div class="card-body">
      <p>
        <span class="profile-key">Username:</span>
        <span id="p-username"></span>
        <a href="change-username.html" class="ml-2 small">Change</a>
      </p>
      <p>
        <span class="profile-key">Name:</span>
        <span id="p-name"></span>
        <a href="change-name.html" class="ml-2 small">Change</a>
      </p>
      <p>
        <span class="profile-key">Email:</span>
        <span id="p-email"></span>
      </p>
      <p>
        <span class="profile-key">Email Verified:</span>
        <span id="p-verified"></span>
        <span id="verify-link"></span>
      </p>
      <hr>
      <a href="change-password.html" class="btn btn-outline-secondary btn-sm">Change Password</a>
      <a href="bookmarks.html" class="btn btn-outline-secondary btn-sm ml-2">My Bookmarks</a>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="assets/js/jquery-3.6.0.min.js"></script>
<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
  if (!SOStudent.initPage(true)) throw '';

  const cu = SOStudent.auth.currentUser();
  $('#p-username').text(cu.username);
  $('#p-name').text(`${cu.firstname} ${cu.lastname}`);
  $('#p-email').text(cu.email);

  if (SOStudent.verification.isVerified(cu.username)) {
    $('#p-verified').html('<span class="badge badge-success">Verified</span>');
  } else {
    $('#p-verified').html('<span class="badge badge-warning">Not Verified</span>');
    const code = SOStudent.verification.generate(cu.username);
    $('#verify-link').html(`<a href="verify-email.html?u=${encodeURIComponent(cu.username)}&demo_code=${code}" class="ml-2 small">Verify now</a>`);
  }
</script>
</body>
</html>
