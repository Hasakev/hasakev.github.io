<!DOCTYPE html>
<html>
<head>
  <title>SOStudent</title>
  <link rel="stylesheet" type="text/css" href="assets/css/bootstrap.css">
  <style>
    #main { height: 100%; }
    footer { position: relative; left: 0; right: 0; margin-top: auto; }
    body { display: flex; flex-direction: column; min-height: 100vh; }
    #main { flex: 1; padding-top: 20px; }
  </style>
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="container mb-2">
  <div class="alert alert-info alert-dismissible fade show" role="alert">
    <strong>Demo mode</strong> — runs entirely in your browser.
    Try <strong>alice&nbsp;/&nbsp;password123</strong> or register a new account.
    <button type="button" class="close" data-dismiss="alert"><span>&times;</span></button>
  </div>
</div>

<div class="container" id="main">
  <div class="col-4 offset-4">
    <h2 class="text-center">Login</h2>
    <div class="form-group">
      <input type="text" id="username" class="form-control" placeholder="Username" required>
    </div>
    <div class="form-group">
      <input type="password" id="password" class="form-control" placeholder="Password" required>
    </div>
    <div id="error" class="form-group"></div>
    <div class="form-group">
      <button onclick="doLogin()" class="btn btn-primary btn-block">Log in</button>
    </div>
    <div class="clearfix">
      <label class="float-left form-check-label">
        <input type="checkbox" id="remember"> Remember me
      </label>
      <a href="forgot-password.html" class="float-right">Forgot Password?</a>
      <br>
      <a href="register.html">Create an Account</a>
    </div>
  </div>
</div>

<div id="footer-placeholder"></div>

<script src="assets/js/jquery-3.6.0.min.js"></script>
<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
  SOStudent.renderNav();
  SOStudent.renderFooter();
  if (SOStudent.remember.check()) window.location.href = 'home.html';
  if (SOStudent.auth.isLoggedIn()) window.location.href = 'home.html';

  function doLogin() {
    const username = $('#username').val().trim();
    const password = $('#password').val();
    if (!username || !password) {
      $('#error').html('<div class="alert alert-danger">Please enter username and password.</div>');
      return;
    }
    const result = SOStudent.auth.login(username, password);
    if (result.ok) {
      if ($('#remember').is(':checked')) SOStudent.remember.set(username);
      window.location.href = 'home.html';
    } else {
      let msg = result.error;
      if (result.needsVerify) {
        msg += ` <a href="verify-email.html?u=${encodeURIComponent(result.username)}">Verify now</a>`;
      }
      $('#error').html(`<div class="alert alert-danger">${msg}</div>`);
    }
  }

  $(document).on('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
