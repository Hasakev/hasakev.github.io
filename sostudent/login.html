<!DOCTYPE html>
<html>
<head>
  <title>SOStudent</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <style>
    #main { height: 100%; }
    footer { position: relative; left: 0; right: 0; margin-top: auto; }
    body { display: flex; flex-direction: column; min-height: 100vh; }
    #main { flex: 1; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <a class="navbar-brand" href="index.html">SOStudent</a>
  <div class="collapse navbar-collapse">
    <ul class="navbar-nav mr-auto">
      <li class="nav-item">
        <a class="nav-link" href="login.html">Home</a>
      </li>
    </ul>
  </div>
  <a class="mx-4" href="login.html" id="nav-login">Login</a>
  <a class="mx-4" href="#" id="nav-logout" onclick="SOStudent.auth.logout(); return false;" style="display:none;">Logout</a>
</nav>

<div class="container mt-3">
  <div class="alert alert-info alert-dismissible fade show" role="alert">
    <strong>Demo mode</strong> — running in your browser with simulated data. Credentials: <strong>alice / password123</strong>
    <button type="button" class="close" data-dismiss="alert"><span>&times;</span></button>
  </div>
</div>

<div class="container" id="main">
  <div class="col-4 offset-4">
    <h2 class="text-center">Login</h2>
    <div class="form-group">
      <input type="text" id="username" class="form-control" placeholder="Username" required>
    </div>
    <div class="form-group">
      <input type="password" id="password" class="form-control" placeholder="Password" required>
    </div>
    <div id="error" class="form-group"></div>
    <div class="form-group">
      <button onclick="doLogin()" class="btn btn-primary btn-block">Log in</button>
    </div>
    <div class="clearfix">
      <label class="float-left form-check-label"><input type="checkbox" id="remember"> Remember me</label>
      <br>
      <a href="register.html">Create an Account</a>
    </div>
  </div>
</div>

<footer id="footer" class="bg-light mt-4">
  <div class="container">
    <div class="row">
      <div class="col-xs-6">
        <p>&copy; 2023 SOStudent</p>
      </div>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
  if (SOStudent.auth.isLoggedIn()) window.location.href = 'home.html';

  function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    if (!username || !password) {
      document.getElementById('error').innerHTML = '<div class="alert alert-danger">Please enter username and password.</div>';
      return;
    }
    if (SOStudent.auth.login(username, password)) {
      window.location.href = 'home.html';
    } else {
      document.getElementById('error').innerHTML = '<div class="alert alert-danger">Invalid username or password.</div>';
    }
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
