<!DOCTYPE html>
<html>
<head>
  <title>SOStudent</title>
  <link rel="stylesheet" type="text/css" href="assets/css/bootstrap.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    #main { flex: 1; }
    footer { position: relative; }
  </style>
</head>
<body>
<div id="navbar-placeholder"></div>
<div class="container" id="main">
  <div class="col-6 offset-3 mt-3">
    <h2 class="text-center">Change Name</h2>
    <div class="form-group">
      <label>First Name:</label>
      <input id="firstname" type="text" class="form-control" required>
    </div>
    <div class="form-group">
      <label>Last Name:</label>
      <input id="lastname" type="text" class="form-control" required>
    </div>
    <div id="error" class="form-group"></div>
    <div class="form-group">
      <button onclick="doSave()" class="btn btn-primary btn-block">Save</button>
      <a href="profile.html" class="btn btn-link">Go back</a>
    </div>
  </div>
</div>
<div id="footer-placeholder"></div>
<script src="assets/js/jquery-3.6.0.min.js"></script>
<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
  if (!SOStudent.initPage(true)) throw '';
  const cu = SOStudent.auth.currentUser();
  $('#firstname').val(cu.firstname);
  $('#lastname').val(cu.lastname);
  function doSave() {
    const firstname = $('#firstname').val().trim();
    const lastname  = $('#lastname').val().trim();
    if (!firstname || !lastname) { $('#error').html('<div class="alert alert-danger">Both fields are required.</div>'); return; }
    if (!/^[a-zA-Z]+$/.test(firstname) || !/^[a-zA-Z]+$/.test(lastname)) {
      $('#error').html('<div class="alert alert-danger">Names must contain only letters.</div>'); return;
    }
    SOStudent.users.update(cu.username, { firstname, lastname });
    window.location.href = 'profile.html';
  }
</script>
</body>
</html>
