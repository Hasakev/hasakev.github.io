<!DOCTYPE html>
<html>
<head>
  <title>SOStudent</title>
  <link rel="stylesheet" type="text/css" href="assets/css/bootstrap.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    #main { flex: 1; }
    footer { position: relative; }
  </style>
</head>
<body>
<div id="navbar-placeholder"></div>
<div class="container" id="main">
  <div class="col-6 offset-3 mt-3">
    <h2 class="text-center">Change Password</h2>
    <div class="form-group">
      <label>Old Password:</label>
      <input id="oldpass" type="password" class="form-control" required>
    </div>
    <div class="form-group">
      <label>New Password:</label>
      <input id="newpass" type="password" class="form-control" required>
    </div>
    <div class="form-group">
      <label>Confirm New Password:</label>
      <input id="confpass" type="password" class="form-control" required>
    </div>
    <div id="error" class="form-group"></div>
    <div class="form-group">
      <button onclick="doSave()" class="btn btn-primary btn-block">Save</button>
      <a href="profile.html" class="btn btn-link">Go back</a>
    </div>
  </div>
</div>
<div id="footer-placeholder"></div>
<script src="assets/js/jquery-3.6.0.min.js"></script>
<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
  if (!SOStudent.initPage(true)) throw '';
  const cu = SOStudent.auth.currentUser();
  function doSave() {
    const oldpass  = $('#oldpass').val();
    const newpass  = $('#newpass').val();
    const confpass = $('#confpass').val();
    const err = $('#error');
    const userRecord = SOStudent.users.get(cu.username);
    if (!userRecord || userRecord.password !== oldpass) {
      err.html('<div class="alert alert-danger">Old password is incorrect.</div>'); return;
    }
    if (newpass.length < 10) { err.html('<div class="alert alert-danger">New password must be at least 10 characters.</div>'); return; }
    if (newpass === oldpass)  { err.html('<div class="alert alert-danger">New password must differ from old password.</div>'); return; }
    if (newpass !== confpass) { err.html('<div class="alert alert-danger">Passwords do not match.</div>'); return; }
    SOStudent.users.update(cu.username, { password: newpass });
    window.location.href = 'profile.html';
  }
</script>
</body>
</html>
