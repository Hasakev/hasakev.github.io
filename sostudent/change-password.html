<!DOCTYPE html>
<html>
<head>
  <title>SOStudent</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    #main { flex: 1; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <a class="navbar-brand" href="home.html">SOStudent</a>
  <div class="collapse navbar-collapse">
    <ul class="navbar-nav mr-auto">
      <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
    </ul>
  </div>
  <a class="mx-4" href="#" id="nav-logout" onclick="SOStudent.auth.logout(); return false;">Logout</a>
</nav>

<div class="container" id="main">
  <div class="col-6 offset-3">
    <h2 class="text-center">Change Password</h2>
    <div class="form-group">
      <label>Old Password:</label>
      <input id="oldpass" type="password" class="form-control" required>
    </div>
    <div class="form-group">
      <label>New Password:</label>
      <input id="newpass" type="password" class="form-control" required>
    </div>
    <div class="form-group">
      <label>Confirm New Password:</label>
      <input id="confpass" type="password" class="form-control" required>
    </div>
    <div id="error" class="form-group"></div>
    <div class="form-group">
      <button onclick="doSave()" class="btn btn-primary btn-block">Save</button>
      <a href="profile.html" class="btn btn-link">Go back</a>
    </div>
  </div>
</div>

<footer class="bg-light mt-4">
  <div class="container"><p>&copy; 2023 SOStudent</p></div>
</footer>

<script src="js/app.js"></script>
<script>
  if (!SOStudent.auth.requireLogin()) throw '';
  const cu = SOStudent.auth.currentUser();

  function doSave() {
    const oldpass = document.getElementById('oldpass').value;
    const newpass = document.getElementById('newpass').value;
    const confpass = document.getElementById('confpass').value;
    const err = document.getElementById('error');

    const userRecord = SOStudent.users.get(cu.username);
    if (!userRecord || userRecord.password !== oldpass) {
      err.innerHTML = '<div class="alert alert-danger">Old password is incorrect.</div>'; return;
    }
    if (newpass.length < 10) {
      err.innerHTML = '<div class="alert alert-danger">New password must be at least 10 characters.</div>'; return;
    }
    if (newpass === oldpass) {
      err.innerHTML = '<div class="alert alert-danger">New password must differ from old password.</div>'; return;
    }
    if (newpass !== confpass) {
      err.innerHTML = '<div class="alert alert-danger">Passwords do not match.</div>'; return;
    }
    SOStudent.users.update(cu.username, { password: newpass });
    window.location.href = 'profile.html';
  }
</script>
</body>
</html>
