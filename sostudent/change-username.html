<!DOCTYPE html>
<html>
<head>
  <title>SOStudent</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    #main { flex: 1; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <a class="navbar-brand" href="home.html">SOStudent</a>
  <div class="collapse navbar-collapse">
    <ul class="navbar-nav mr-auto">
      <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
    </ul>
  </div>
  <a class="mx-4" href="#" id="nav-logout" onclick="SOStudent.auth.logout(); return false;">Logout</a>
</nav>

<div class="container" id="main">
  <div class="col-6 offset-3">
    <h2 class="text-center">Change Username</h2>
    <div class="form-group">
      <label>New Username:</label>
      <input id="username" type="text" class="form-control" required>
    </div>
    <div id="error" class="form-group"></div>
    <div class="form-group">
      <button onclick="doSave()" class="btn btn-primary btn-block">Save</button>
      <a href="profile.html" class="btn btn-link">Go back</a>
    </div>
  </div>
</div>

<footer class="bg-light mt-4">
  <div class="container"><p>&copy; 2023 SOStudent</p></div>
</footer>

<script src="js/app.js"></script>
<script>
  if (!SOStudent.auth.requireLogin()) throw '';
  const cu = SOStudent.auth.currentUser();
  document.getElementById('username').value = cu.username;

  function doSave() {
    const username = document.getElementById('username').value.trim();
    const err = document.getElementById('error');
    if (!username) { err.innerHTML = '<div class="alert alert-danger">Username is required.</div>'; return; }
    if (username.length < 4 || username.length > 15) {
      err.innerHTML = '<div class="alert alert-danger">Username must be 4–15 characters.</div>'; return;
    }
    const result = SOStudent.users.update(cu.username, { username });
    if (!result.ok) { err.innerHTML = `<div class="alert alert-danger">${result.error}</div>`; return; }
    window.location.href = 'profile.html';
  }
</script>
</body>
</html>
