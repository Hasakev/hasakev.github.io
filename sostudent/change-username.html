<!DOCTYPE html>
<html>
<head>
  <title>SOStudent</title>
  <link rel="stylesheet" type="text/css" href="assets/css/bootstrap.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    #main { flex: 1; }
    footer { position: relative; }
  </style>
</head>
<body>
<div id="navbar-placeholder"></div>
<div class="container" id="main">
  <div class="col-6 offset-3 mt-3">
    <h2 class="text-center">Change Username</h2>
    <div class="form-group">
      <label>New Username:</label>
      <input id="username" type="text" class="form-control" required>
    </div>
    <div id="error" class="form-group"></div>
    <div class="form-group">
      <button onclick="doSave()" class="btn btn-primary btn-block">Save</button>
      <a href="profile.html" class="btn btn-link">Go back</a>
    </div>
  </div>
</div>
<div id="footer-placeholder"></div>
<script src="assets/js/jquery-3.6.0.min.js"></script>
<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
  if (!SOStudent.initPage(true)) throw '';
  const cu = SOStudent.auth.currentUser();
  $('#username').val(cu.username);
  function doSave() {
    const username = $('#username').val().trim();
    if (!username) { $('#error').html('<div class="alert alert-danger">Username is required.</div>'); return; }
    if (username.length < 4 || username.length > 15) {
      $('#error').html('<div class="alert alert-danger">Username must be 4–15 characters.</div>'); return;
    }
    const result = SOStudent.users.update(cu.username, { username });
    if (!result.ok) { $('#error').html(`<div class="alert alert-danger">${result.error}</div>`); return; }
    window.location.href = 'profile.html';
  }
</script>
</body>
</html>
